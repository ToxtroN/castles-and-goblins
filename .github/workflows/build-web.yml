name: Build Web (Yandex Games)

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true
      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --import || true
          godot --headless --export-release "Web" build/web/index.html
      - name: Zip for Yandex Games
        run: |
          apt-get update -qq && apt-get install -y -qq zip
          cd build/web && zip -qr ../../castles-and-goblins-yandex.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: castles-and-goblins-yandex
          path: castles-and-goblins-yandex.zip
